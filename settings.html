<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>股票监测宠物 - 设置</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        background: #070d14;
        color: #9fb4ba;
        font-family: system-ui, sans-serif;
      }
    </style>
    <script>
      window.showBootError = function (message) {
        var root = document.getElementById("root");
        if (!root) return;
        root.innerHTML = '<pre style="padding:24px;white-space:pre-wrap;color:#ffb4ae;">' + String(message).replace(/[<>&]/g, function (char) {
          return { '<': '&lt;', '>': '&gt;', '&': '&amp;' }[char];
        }) + '</pre>';
      };
      window.addEventListener("error", function (event) { window.showBootError(event.message || "脚本加载失败"); });
      window.addEventListener("unhandledrejection", function (event) { window.showBootError(event.reason || "异步初始化失败"); });
    </script>
  </head>
  <body>
    <div id="root">
      <div style="display: grid; place-items: center; height: 100vh; letter-spacing: .2em;">
        设置界面加载中...
      </div>
    </div>
    <script type="module" src="/src/settings-main.tsx"></script>
  </body>
</html>
